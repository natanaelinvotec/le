<!-- campeonatos.html — Campeonatos (interno e externo).
Responsável do núcleo, Admin Master e Fundador criam o campeonato, geram as
categorias (graduação × peso × sexo, idade opcional), montam as chaves,
registram os resultados e encerram. Atletas se inscrevem pelo app e
acompanham as chaves. Tela de área (#area/ID/CATEGORIA) é o placar para TV.
Regras: js/campeonato-motor.js (puro, testado); dados: campeonatos/{id},
campeonatos/{id}/inscricoes/{uid}, campeonatos/{id}/chaves/{categoriaId}. -->
