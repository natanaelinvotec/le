<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site da escola · AtletaPay</title>
<meta name="description" content="Site da escola de artes marciais, gerado pelo AtletaPay.">
<meta name="theme-color" content="#06080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Fraunces:ital,opsz,wght@1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* LIGHT (padrão) */
    --ink:#eef2f6; --ink-2:#e6ebf1; --panel:#ffffff; --panel-2:#f4f7fa;
    --line:rgba(12,22,34,.11); --line-2:rgba(12,22,34,.06);
    --fg:#0d1622; --fg-soft:#4e5c6b; --fg-dim:#7c8795;
    --glass:rgba(255,255,255,.66); --glass-line:rgba(12,22,34,.12);
    --sh-sm:0 1px 2px rgba(12,22,34,.06),0 4px 14px rgba(12,22,34,.05);
    --sh-md:0 12px 30px rgba(12,22,34,.12),0 3px 8px rgba(12,22,34,.07);
    --sh-lg:0 30px 70px rgba(10,16,28,.2),0 10px 26px rgba(10,16,28,.12);
    --ease:cubic-bezier(.16,1,.3,1);
    /* CINEMATOGRÁFICO fixo (hero/closing) — fundo escuro + texto claro nos 2 temas */
    --hero-fg:#f3f7fb; --hero-soft:rgba(243,247,251,.78); --hero-dim:rgba(243,247,251,.56);
    --hero-line:rgba(255,255,255,.14); --hero-glass:rgba(8,12,20,.42);
    /* per-school (set by JS on #site) */
    --p:#0b1a3a; --p2:#0a1430; --a:#389e92; --a2:#00e676; --a-ink:#04140f;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#06080d; --ink-2:#0b0f18; --panel:#10151f; --panel-2:#161c28;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.055);
    --fg:#eef2f6; --fg-soft:rgba(238,242,246,.74); --fg-dim:rgba(238,242,246,.52);
    --glass:rgba(10,14,22,.60); --glass-line:rgba(255,255,255,.12);
    --sh-sm:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    --sh-md:0 10px 30px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.4);
    --sh-lg:0 30px 80px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --ink:#06080d; --ink-2:#0b0f18; --panel:#10151f; --panel-2:#161c28;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.055);
    --fg:#eef2f6; --fg-soft:rgba(238,242,246,.74); --fg-dim:rgba(238,242,246,.52);
    --glass:rgba(10,14,22,.60); --glass-line:rgba(255,255,255,.12);
    --sh-sm:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    --sh-md:0 10px 30px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.4);
    --sh-lg:0 30px 80px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ink);color:var(--fg);font-family:"Inter",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* Arena respeita "reduzir movimento" do sistema; os templates próprios (body.tpl-modulo) tratam isso por conta própria. */
  @media (prefers-reduced-motion:reduce){body:not(.tpl-modulo) *{animation-duration:.001ms!important;transition-duration:.001ms!important}html{scroll-behavior:auto}}
  h1,h2,h3,h4{font-family:"Bricolage Grotesque","Inter",sans-serif;line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance}
  em.ed{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;letter-spacing:-.01em}
  p{margin:0}
  a{color:inherit;text-decoration:none}
  svg{width:18px;height:18px;flex:none}
  img{max-width:100%;display:block}
  .wrap{width:min(1120px,100%);margin-inline:auto;padding-inline:clamp(16px,4vw,44px)}

  /* nav */
  .nav{position:sticky;top:0;z-index:70;background:color-mix(in srgb,var(--ink) 74%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--line-2);transition:background .4s var(--ease)}
  .nav .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
  .nav .logo{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
  .nav .crest{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:16px;color:var(--a-ink);background:linear-gradient(135deg,var(--a2),var(--a));box-shadow:0 6px 18px color-mix(in srgb,var(--a) 40%,transparent);overflow:hidden}
  .nav .crest img{width:100%;height:100%;object-fit:cover}
  .nav .nm{min-width:0}
  .nav .nm b{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .nav .nm span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim)}
  .nav .nlinks{display:flex;gap:4px}
  .nav .nlinks a{font-size:13.5px;font-weight:500;color:var(--fg-soft);padding:8px 11px;border-radius:9px;transition:all .3s var(--ease)}
  .nav .nlinks a:hover{background:var(--line-2);color:var(--fg)}
  .btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:14px;padding:11px 18px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease);white-space:nowrap}
  .btn svg{width:17px;height:17px;transition:transform .3s var(--ease)}
  .btn-go{background:linear-gradient(135deg,var(--a2),color-mix(in srgb,var(--a2) 60%,var(--a)));color:var(--a-ink);box-shadow:0 10px 26px color-mix(in srgb,var(--a2) 32%,transparent)}
  .btn-go:hover{transform:translateY(-2px);box-shadow:0 16px 34px color-mix(in srgb,var(--a2) 40%,transparent)}
  .btn-go:hover svg{transform:translateX(3px)}
  .btn-line{border-color:var(--line);background:var(--panel);color:var(--fg)}
  .btn-line:hover{background:var(--panel-2);transform:translateY(-2px)}
  .btn-lg{padding:15px 24px;font-size:15.5px;border-radius:14px}
  .btn-ghost{color:var(--fg-soft);padding:10px 12px;background:transparent}
  .btn-ghost:hover{color:var(--fg)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
  .theme-toggle{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg-soft);width:40px;height:40px;border-radius:11px;cursor:pointer;display:grid;place-items:center;transition:transform .3s var(--ease),color .3s var(--ease),background .3s var(--ease);flex:none}
  .theme-toggle:hover{color:var(--fg);transform:translateY(-2px)}
  .theme-toggle:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
  .hide-sm{display:inline-flex}

  /* hero */
  .hero{position:relative;overflow:hidden;min-height:clamp(540px,82svh,740px);display:flex;align-items:flex-end;isolation:isolate;color:var(--hero-fg);background:radial-gradient(120% 90% at 78% 8%,var(--p) 0%,var(--p2) 46%,#06080d 100%)}
  .hero .motif{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:.85;transform-origin:62% 48%;animation:motifDrift 26s cubic-bezier(.77,0,.175,1) infinite alternate}
  @keyframes motifDrift{0%{transform:translate3d(0,0,0) scale(1.03) rotate(0)}50%{transform:translate3d(-1.1%,.9%,0) scale(1.06) rotate(.5deg)}100%{transform:translate3d(.9%,-.7%,0) scale(1.04) rotate(-.4deg)}}
  .hero .veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 28%,color-mix(in srgb,#06080d 55%,transparent) 72%,#06080d 100%),linear-gradient(90deg,color-mix(in srgb,#06080d 58%,transparent),transparent 58%)}
  .hero .wrap{padding-block:clamp(40px,8vw,80px) clamp(28px,5vw,50px);width:100%}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.85fr);gap:40px;align-items:end}
  .badge{display:inline-flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque",sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;padding:8px 15px;border-radius:999px;background:var(--hero-glass);border:1px solid var(--hero-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--hero-fg)}
  .badge .pulse{width:8px;height:8px;border-radius:50%;background:var(--a2);animation:pulse 2.6s cubic-bezier(.77,0,.175,1) infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.35);opacity:.6}}
  .hero h1{font-size:clamp(32px,6.4vw,62px);font-weight:800;letter-spacing:-.03em;margin:18px 0 0;line-height:.98;max-width:15ch}
  .hero .sub{margin-top:18px;font-size:clamp(16px,2.4vw,20px);color:var(--hero-soft);max-width:46ch;line-height:1.4}
  .hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .hero .btn-line{background:rgba(255,255,255,.07);border-color:var(--hero-line);color:var(--hero-fg)}
  .hero .btn-line:hover{background:rgba(255,255,255,.13)}
  .hero-loc{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13.5px;color:var(--hero-dim)}
  .hero-loc svg{width:16px;height:16px;opacity:.75}
  .crest-stage{position:relative;aspect-ratio:1;display:grid;place-items:center}
  .crest-stage .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed color-mix(in srgb,var(--a) 50%,transparent);animation:spin 46s linear infinite}
  .crest-stage .ring.r2{inset:14%;border-style:solid;border-color:color-mix(in srgb,var(--a2) 24%,transparent);animation-duration:32s;animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .crest-stage .big-crest{width:56%;aspect-ratio:1;border-radius:28px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,7vw,64px);color:var(--a-ink);background:linear-gradient(150deg,var(--a2),var(--a));box-shadow:var(--sh-lg),inset 0 2px 0 rgba(255,255,255,.3);overflow:hidden}
  .crest-stage .big-crest img{width:100%;height:100%;object-fit:cover}
  .crest-stage .sat{position:absolute;top:6%;right:12%;width:46px;height:46px;border-radius:14px;background:var(--hero-glass);border:1px solid var(--hero-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--a2);animation:bob 5s cubic-bezier(.16,1,.3,1) infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .hero-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(26px,5vw,40px);padding-top:clamp(20px,4vw,28px);border-top:1px solid var(--hero-line)}
  .hero-chips .chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;background:var(--hero-glass);border:1px solid var(--hero-line);color:var(--hero-fg)}
  .hero-chips .chip svg{width:15px;height:15px;color:var(--a2)}
  .hero-chips .chip b{font-weight:700}

  /* sections */
  section{margin-top:clamp(50px,9vw,96px)}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);margin:0 0 16px}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--a2);box-shadow:0 0 0 4px color-mix(in srgb,var(--a2) 20%,transparent)}
  .sec-h{font-size:clamp(26px,5vw,42px);font-weight:800;letter-spacing:-.03em}
  .lede{margin-top:14px;color:var(--fg-soft);font-size:clamp(15px,2.3vw,18px);max-width:62ch}

  .sobre-card{margin-top:30px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,34px);box-shadow:var(--sh-sm)}
  .sobre-card p{font-size:clamp(15px,2.3vw,18px);color:var(--fg-soft);line-height:1.6}

  /* graduação */
  .grad{margin-top:30px;background:linear-gradient(170deg,var(--panel),var(--ink));border:1px solid var(--line);border-radius:26px;padding:clamp(24px,5vw,44px);position:relative;overflow:hidden}
  .grad::before{content:"";position:absolute;top:-30%;right:-10%;width:50%;height:80%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 20%,transparent),transparent 70%);filter:blur(34px);z-index:0}
  .grad>*{position:relative;z-index:1}
  .ladder{display:flex;flex-direction:column;gap:11px;margin-top:4px}
  .rung{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:15px}
  .rung .st{font-family:"Fraunces",serif;font-style:italic;font-size:13px;color:var(--fg-dim)}
  .rung .bar{height:16px;border-radius:9px;background:var(--line-2);overflow:hidden;position:relative}
  .rung .fill{position:absolute;inset:0;border-radius:9px;transform-origin:left;transform:scaleX(0)}
  .rung .fill.lite{box-shadow:inset 0 0 0 1px var(--line)}
  .anim.in .rung .fill{animation:grow 1s var(--ease) forwards;animation-delay:calc(var(--j,0)*85ms + 120ms)}
  @keyframes grow{to{transform:scaleX(1)}}
  .rung .lbl{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;white-space:nowrap}
  .rung .lbl small{display:block;font-family:"Inter";font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)}
  .cordao{height:34px;border-radius:12px;margin-top:4px;background:repeating-linear-gradient(118deg,var(--p) 0 16px,var(--a) 16px 30px,var(--a2) 30px 38px,var(--a) 38px 52px);background-size:200% 100%}
  .anim.in .cordao{animation:slideband 1.1s var(--ease) both}
  @keyframes slideband{from{background-position:60% 0}to{background-position:0 0}}
  .grad-note{margin-top:24px;font-size:13.5px;color:var(--fg-dim);display:flex;align-items:flex-start;gap:9px}
  .grad-note svg{width:16px;height:16px;color:var(--a2);margin-top:2px}

  /* núcleos */
  .nuclei{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px;margin-top:30px}
  .nucleus{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh-sm);transition:transform .4s var(--ease),border-color .4s var(--ease),box-shadow .4s var(--ease)}
  .nucleus:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--a) 50%,var(--line));box-shadow:var(--sh-md)}
  .nucleus .ini{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--a-ink);background:linear-gradient(135deg,var(--a2),var(--a))}
  .nucleus .nn{font-weight:650;font-size:15px;line-height:1.25}
  .addr-line{margin-top:20px;display:flex;align-items:flex-start;gap:11px;color:var(--fg-dim);font-size:14.5px}
  .addr-line svg{width:16px;height:16px;color:var(--a2);margin-top:2px}
  .addr-line .sel{color:var(--fg);font-weight:600;user-select:all}

  /* closing / contato */
  .closing{position:relative;overflow:hidden;border-radius:28px;padding:clamp(32px,6vw,60px);margin-top:30px;background:radial-gradient(120% 120% at 20% 0%,var(--p) 0%,var(--p2) 50%,#06080d 100%);border:1px solid var(--hero-line);color:var(--hero-fg)}
  .closing .eyebrow{color:var(--hero-dim)}
  .closing h2{font-size:clamp(28px,5.5vw,50px);font-weight:800;letter-spacing:-.03em}
  .closing .contact{display:flex;flex-wrap:wrap;gap:14px 36px;margin-top:24px}
  .closing .ci{display:flex;align-items:center;gap:11px}
  .closing .ci .ic{width:40px;height:40px;border-radius:12px;background:var(--hero-glass);border:1px solid var(--hero-line);display:grid;place-items:center;flex:none;color:var(--hero-fg)}
  .closing .ci small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-dim)}
  .closing .ci b{font-size:15px;font-weight:600;user-select:all;word-break:break-word}
  .closing .big-cta{margin-top:28px}

  /* footer */
  .foot{margin-top:clamp(40px,7vw,70px);padding-block:28px 42px;border-top:1px solid var(--line-2)}
  .foot .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}
  .foot .ap{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-dim)}
  .foot .ap .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#00e676,#0b7cff);display:grid;place-items:center;color:#031;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;font-size:12px}
  .foot .meta{font-size:12.5px;color:var(--fg-dim)}

  /* entrance */
  .anim{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .anim.in{opacity:1;transform:none}

  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr;gap:28px}
    .crest-stage{max-width:320px;margin-inline:auto;order:-1}
    .nav .nlinks{display:none}
    .hide-sm{display:none}
    .nav .nm b{max-width:40vw}
  }
</style>
</head>
<body>
<div id="site" aria-live="polite"></div>
<script type="module" src="js/site-escola.js?v=20261020"></script>
</body>
</html>
