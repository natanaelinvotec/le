<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site da escola · AtletaPay</title>
<meta name="description" content="Site da escola de artes marciais, gerado pelo AtletaPay.">
<meta name="theme-color" content="#002D72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ---------- Base theme tokens (light) ---------- */
  :root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#f3f5f8;
    --text:#0f1720;
    --text-muted:#5b6673;
    --border:rgba(15,23,32,.10);
    --border-2:rgba(15,23,32,.06);
    --glass:rgba(255,255,255,.72);
    --glass-border:rgba(255,255,255,.65);
    --shadow-sm:0 1px 2px rgba(15,23,32,.06), 0 4px 14px rgba(15,23,32,.05);
    --shadow-md:0 8px 24px rgba(15,23,32,.10), 0 2px 6px rgba(15,23,32,.06);
    --shadow-lg:0 24px 60px rgba(10,15,25,.22), 0 8px 24px rgba(10,15,25,.14);
    --on-dark:#ffffff;
    --on-dark-soft:rgba(255,255,255,.82);
    --ease:cubic-bezier(.16,1,.3,1);
    /* school tokens (overwritten per-render by inline style) */
    --ep:#1e2a78; --ed:#389e92; --eb:#ff7a1a; --eb-text:#fff; --ed-text:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0a0e13;
      --surface:#121820;
      --surface-2:#1a212b;
      --text:#eef2f6;
      --text-muted:#9aa7b4;
      --border:rgba(255,255,255,.12);
      --border-2:rgba(255,255,255,.07);
      --glass:rgba(16,22,30,.66);
      --glass-border:rgba(255,255,255,.10);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
      --shadow-md:0 10px 28px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
      --shadow-lg:0 26px 64px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0a0e13;
    --surface:#121820;
    --surface-2:#1a212b;
    --text:#eef2f6;
    --text-muted:#9aa7b4;
    --border:rgba(255,255,255,.12);
    --border-2:rgba(255,255,255,.07);
    --glass:rgba(16,22,30,.66);
    --glass-border:rgba(255,255,255,.10);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
    --shadow-md:0 10px 28px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
    --shadow-lg:0 26px 64px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .container{width:min(1080px,100%);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
  h1,h2,h3{font-family:"Bricolage Grotesque","Inter",sans-serif;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
  p{margin:0}
  a{color:inherit}

  /* ---------- Site shell ---------- */
  .site{padding-bottom:40px}
  .site .container{padding-block:0}
  section{margin-top:clamp(26px,5vw,52px)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 14px}
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--ed);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ed) 22%,transparent)}
  .sec-h{font-size:clamp(22px,4.4vw,30px);font-weight:700;margin-bottom:12px}
  .lede{color:var(--text-muted);font-size:clamp(15px,2.4vw,17px);max-width:62ch}

  /* entrance */
  @keyframes rise{from{opacity:.0001;transform:translateY(16px)}to{opacity:1;transform:none}}
  .anim{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;overflow:hidden;border-radius:26px;margin-top:clamp(18px,3.5vw,28px);
    background:linear-gradient(150deg,var(--ep),color-mix(in srgb,var(--ep) 52%,#05070e));
    color:var(--on-dark);box-shadow:var(--shadow-lg);
    isolation:isolate;
  }
  .hero .motif{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:.9}
  .hero::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(175deg,transparent 35%,rgba(0,0,0,.34));pointer-events:none}
  .hero-inner{padding:clamp(26px,5.5vw,56px) clamp(22px,5vw,52px)}
  .chip-saud{
    display:inline-flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:14px;padding:8px 15px;border-radius:999px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .chip-saud .spark{width:7px;height:7px;border-radius:50%;background:var(--eb);box-shadow:0 0 0 4px color-mix(in srgb,var(--eb) 40%,transparent)}
  .hero-id{display:flex;align-items:center;gap:16px;margin:22px 0 4px}
  .mono{
    width:clamp(58px,13vw,78px);height:clamp(58px,13vw,78px);flex:none;border-radius:20px;
    display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
    font-size:clamp(24px,6vw,34px);color:var(--on-dark);letter-spacing:-.02em;overflow:hidden;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), var(--shadow-md);
  }
  .mono img{width:100%;height:100%;object-fit:cover;display:block}
  .hero h1{font-size:clamp(28px,6.6vw,52px);font-weight:800;letter-spacing:-.025em;max-width:16ch}
  .hero .tagline{margin-top:14px;font-size:clamp(16px,3vw,21px);color:var(--on-dark-soft);max-width:34ch;line-height:1.35}
  .hero .loc{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:14px;color:var(--on-dark-soft)}
  .hero .loc svg{opacity:.85}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;
    padding:13px 22px;border-radius:13px;text-decoration:none;display:inline-flex;align-items:center;gap:9px;
    transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .4s var(--ease);
  }
  .btn-primary{background:var(--eb);color:var(--eb-text);box-shadow:0 10px 26px color-mix(in srgb,var(--eb) 45%,transparent)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 34px color-mix(in srgb,var(--eb) 55%,transparent)}
  .btn-ghost{background:rgba(255,255,255,.10);color:var(--on-dark);border:1px solid rgba(255,255,255,.34)}
  .btn-ghost:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}

  /* ---------- Stat chips ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .stat{
    display:inline-flex;align-items:center;gap:9px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:13px;padding:10px 14px;font-size:13.5px;font-weight:600;
  }
  .stat svg{color:var(--ed);flex:none}
  .stat b{font-weight:700}

  /* ---------- Cards / sobre ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm)}
  .sobre{padding:clamp(20px,4vw,30px);display:grid;gap:18px}
  .sobre p{font-size:clamp(15px,2.5vw,17.5px);color:var(--text);line-height:1.6}

  /* ---------- Graduação ---------- */
  .grad{padding:clamp(20px,4vw,30px)}
  .ladder{display:grid;gap:12px;margin-top:4px}
  .belt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}
  .belt-track{position:relative;height:28px;border-radius:8px;overflow:hidden;background:var(--bc);box-shadow:var(--shadow-sm);transform-origin:left}
  .belt-track.lite{box-shadow:inset 0 0 0 1px var(--border), var(--shadow-sm)}
  .belt-tip{position:absolute;right:0;top:0;bottom:0;width:30%;background:color-mix(in srgb,var(--bc) 55%,#000)}
  .belt-tip::after{content:"";position:absolute;left:28%;top:0;bottom:0;width:7px;background:rgba(255,255,255,.55)}
  .belt-name{font-weight:700;font-size:14.5px;white-space:nowrap}
  .belt-name small{display:block;font-weight:500;font-size:11.5px;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}
  @keyframes grow{from{transform:scaleX(.08);opacity:.2}to{transform:scaleX(1);opacity:1}}
  .anim .belt-track{animation:grow .8s var(--ease) both;animation-delay:calc(var(--j,0)*90ms + 120ms)}

  .cordao-wrap{margin-top:4px}
  .cordao{
    height:34px;border-radius:12px;box-shadow:var(--shadow-sm);
    background:repeating-linear-gradient(118deg,var(--ep) 0 16px,var(--ed) 16px 30px,var(--eb) 30px 38px,var(--ed) 38px 52px);
    background-size:200% 100%;
  }
  @keyframes slideband{from{background-position:60% 0}to{background-position:0 0}}
  .anim .cordao{animation:slideband 1.1s var(--ease) both}
  .grad-note{margin-top:16px;color:var(--text-muted);font-size:14.5px;display:flex;gap:11px;align-items:flex-start}
  .grad-note svg{flex:none;color:var(--ed);margin-top:2px}

  /* ---------- Núcleos ---------- */
  .nucleos{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));margin-top:4px}
  .nuc{padding:18px;display:flex;align-items:center;gap:13px;transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .4s var(--ease)}
  .nuc:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--ed) 45%,var(--border))}
  .nuc .nm{
    width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;color:var(--ed-text);
    background:linear-gradient(140deg,var(--ed),color-mix(in srgb,var(--ep) 60%,var(--ed)));
  }
  .nuc .nn{font-weight:650;font-size:14.5px;line-height:1.25}
  .addr-line{margin-top:16px;display:flex;align-items:flex-start;gap:11px;color:var(--text-muted);font-size:14.5px}
  .addr-line svg{flex:none;color:var(--ed);margin-top:2px}
  .addr-line .sel{color:var(--text);font-weight:600;user-select:all}

  /* ---------- Contato ---------- */
  .contato{padding:clamp(22px,4.5vw,34px);display:grid;gap:22px;
    background:linear-gradient(150deg,color-mix(in srgb,var(--ep) 10%,var(--surface)),var(--surface));}
  .contato-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
  .ci{display:flex;gap:12px;align-items:flex-start}
  .ci .ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);color:var(--ed)}
  .ci .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700}
  .ci .v{font-weight:600;font-size:15px;user-select:all;word-break:break-word}
  .contato .btn-primary{align-self:start}

  /* ---------- Footer ---------- */
  .foot{margin-top:40px;border-top:1px solid var(--border);padding-top:22px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;color:var(--text-muted);font-size:13px}
  .foot .made{display:inline-flex;align-items:center;gap:8px;font-weight:600}
  .foot .made .logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#389e92,#1e2a78);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif}

  @media (max-width:560px){
    .hero-id{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion: reduce){
    .anim,.anim .belt-track,.anim .cordao{animation:none}
    *{transition-duration:.001ms !important}
  }

  /* ===================== MOTION LAYER (inlined CSS) ===================== */
  :root{
    /* Motion tokens — deliberate curves (built-in CSS easings are too weak) */
    --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    /* --ease (hover) already exists in the base file as cubic-bezier(.16,1,.3,1) */

    --dur-press: 140ms;   /* button press feedback            */
    --dur-hover: 190ms;   /* hover lifts, chip + arrow nudges  */
    --dur-enter: 600ms;   /* first-load section rise           */
    --dur-switch: 440ms;  /* re-render settle                  */
    --dur-xfade: 320ms;   /* outgoing snapshot crossfade       */
  }

  /* 1. SINGLE SOURCE OF TRUTH FOR THE ENTRANCE */
  .anim{animation:none !important}
  .anim .belt-track{animation:none !important}
  .anim .cordao{animation:none !important}

  .site{position:relative}
  .motion-root{position:relative}
  .motion-overlay{
    position:absolute; top:0; left:0; right:0; z-index:40;
    pointer-events:none; will-change:opacity, transform;
  }

  /* 2. HOVER / PRESS MICRO-INTERACTIONS */
  .btn{
    transition:
      transform  var(--dur-hover) var(--ease-out),
      box-shadow var(--dur-hover) var(--ease-out),
      background-color var(--dur-hover) var(--ease);
  }
  .btn:active{transform:translateY(0) scale(.97)}
  .btn svg{transition:transform var(--dur-hover) var(--ease-out)}

  .nuc{
    transition:
      transform  var(--dur-hover) var(--ease-out),
      box-shadow var(--dur-hover) var(--ease-out),
      border-color var(--dur-hover) var(--ease);
  }
  .stat{
    transition:
      transform  var(--dur-hover) var(--ease-out),
      border-color var(--dur-hover) var(--ease),
      background-color var(--dur-hover) var(--ease);
  }

  @media (hover: hover) and (pointer: fine){
    .nuc:hover{transform:translateY(-4px); box-shadow:var(--shadow-md)}
    .stat:hover{
      transform:translateY(-2px);
      border-color:color-mix(in srgb, var(--ed) 42%, var(--border));
    }
    .btn-primary:hover svg{transform:translateX(3px)}
    .btn-ghost:hover svg{transform:translateX(2px)}
  }
  @media (hover: none){
    .nuc:hover,
    .btn-primary:hover,
    .btn-ghost:hover{transform:none}
  }

  /* 3. FOCUS-VISIBLE */
  .btn:focus-visible,
  a:focus-visible{
    box-shadow:0 0 0 4px color-mix(in srgb, var(--ed) 50%, transparent);
  }
  .nuc:focus-visible,
  .stat:focus-visible{
    outline:2px solid var(--ed);
    outline-offset:3px;
  }

  /* 4. AMBIENT HERO MOTION */
  .hero .motif{
    transform-origin:62% 48%;
    will-change:transform;
    animation:motifDrift 26s var(--ease-in-out) infinite alternate;
  }
  @keyframes motifDrift{
    0%  {transform:translate3d(0,0,0)          scale(1.015) rotate(0deg)}
    50% {transform:translate3d(-1.1%, 0.9%,0)  scale(1.05)  rotate(0.6deg)}
    100%{transform:translate3d(0.9%, -0.7%,0)  scale(1.03)  rotate(-0.5deg)}
  }

  .chip-saud .spark{
    will-change:transform, opacity;
    animation:sparkPulse 2.6s var(--ease-in-out) infinite;
  }
  @keyframes sparkPulse{
    0%,100%{transform:scale(1);    opacity:.95}
    50%    {transform:scale(1.35); opacity:.6}
  }

  /* 5. REDUCED MOTION */
  @media (prefers-reduced-motion: reduce){
    .hero .motif,
    .chip-saud .spark{animation:none !important}

    *,
    *::before,
    *::after{
      animation-duration:1ms !important;
      animation-iteration-count:1 !important;
      transition-duration:1ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>
<div class="site">
  <div class="container" id="site" aria-live="polite"></div>
</div>

<script type="module" src="js/site-escola.js?v=20261013"></script>
</body>
</html>
