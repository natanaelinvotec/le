<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#002D72">
<title>Sem internet</title>
<link rel="icon" type="image/png" href="assets/app-favicon-32.png">
<style>
:root{--teal:#389E92;--navy:#002D72;--verde:#00E676;--fundo:#EAF2F1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Manrope,system-ui,-apple-system,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#dff0ec,var(--fundo));color:#0f2230}
.cx{max-width:380px;width:100%;text-align:center;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,45,114,.1);border-radius:24px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,45,114,.14)}
img{width:84px;height:84px;border-radius:50%;box-shadow:0 10px 26px rgba(0,45,114,.25);animation:pulsa 2.4s cubic-bezier(.16,1,.3,1) infinite}
h1{font-size:1.25rem;margin:16px 0 6px;color:var(--navy)}
p{margin:0 0 18px;color:#4b5b66;line-height:1.5;font-size:.95rem}
button{border:0;border-radius:14px;padding:13px 20px;font:800 .92rem Manrope,system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,var(--teal),#0B5C52);box-shadow:0 10px 22px rgba(56,158,146,.35);cursor:pointer}
button:focus-visible{outline:3px solid var(--verde);outline-offset:3px}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
</head>
<body>
<main class="cx">
<img src="assets/logo-liberdade150.png" alt="">
<h1>Sem internet agora</h1>
<p>Esta tela ainda não estava guardada no aparelho. As telas que você já abriu continuam funcionando; assim que o sinal voltar, é só tentar de novo.</p>
<button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
