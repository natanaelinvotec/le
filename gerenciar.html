<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciar o site — Capoeira Liberdade e Expressão</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#061A3A">
<link rel="icon" href="assets/app-icon-192.png" sizes="192x192" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/gerenciar.css?v=20260928">
</head>
<body>

<div id="telaCarregando" class="tela-centro"><span class="giro" aria-hidden="true"></span><p>Carregando…</p></div>

<div id="telaEntrar" class="tela-centro" hidden>
  <form id="formEntrar" class="cartao-entrar" novalidate>
    <img src="assets/logo-liberdade.png" alt="Brasão do grupo" width="84" height="84">
    <h1>Gerenciar o site</h1>
    <p>Área do Admin Master. Use a mesma conta do painel de gestão.</p>
    <label for="email">E-mail<input id="email" type="email" autocomplete="username" required></label>
    <label for="senha">Senha<input id="senha" type="password" autocomplete="current-password" required></label>
    <p id="erroEntrar" class="erro" role="alert"></p>
    <button id="btEntrar" class="bt bt-verde" type="submit">Entrar</button>
    <button id="btEsqueci" class="link" type="button">Esqueci minha senha</button>
    <a class="link" href="index.html">← Voltar para o site</a>
  </form>
</div>

<div id="telaPainel" hidden>
  <header class="barra">
    <a class="marca" href="index.html" target="_blank" rel="noopener" title="Abrir o site"><img src="assets/logo-liberdade.png" alt="" width="40" height="40"><span><b>Gerenciar o site</b><small id="quem"></small></span></a>
    <span id="estado" class="estado" role="status" aria-live="polite"></span>
    <div class="barra-bts">
      <button id="btPrevia" type="button" class="bt bt-linha so-celular">Prévia</button>
      <button id="btDescartar" type="button" class="bt bt-linha" disabled>Descartar</button>
      <button id="btPublicar" type="button" class="bt bt-verde" disabled>Publicar</button>
    </div>
  </header>

  <div class="corpo">
    <nav class="lateral" aria-label="Seções do site">
      <div id="secoes" class="secoes"></div>
      <div class="lateral-rodape">
        <button id="btAnterior" type="button" class="link">Voltar à versão anterior</button>
        <button id="btPadrao" type="button" class="link">Restaurar conteúdo padrão</button>
        <button id="btBaixar" type="button" class="link">Baixar cópia (JSON)</button>
        <a class="link" href="admin.html">Painel de gestão</a>
        <button id="btSair" type="button" class="link">Sair</button>
      </div>
    </nav>

    <section id="form" class="form" aria-label="Editar seção"></section>

    <section class="lado-previa" aria-label="Prévia do site">
      <div class="previa-bts" role="group" aria-label="Tamanho da prévia">
        <button type="button" class="on" data-largura="pc">Computador</button>
        <button type="button" data-largura="cel">Celular</button>
      </div>
      <div id="moldura" class="moldura" data-largura="pc"><iframe id="previa" title="Prévia do site" loading="lazy"></iframe></div>
      <p class="dica">A prévia mostra o rascunho. O site só muda quando você toca em <b>Publicar</b>.</p>
    </section>
  </div>
</div>

<script type="module" src="js/gerenciar.js?v=20260928"></script>
</body>
</html>
