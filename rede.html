<!-- rede.html — Rede Liberdade 2.0: rede social interna do grupo, só pra quem
está logado no app. Feed com stories e avisos, perfil de atleta (bio, trajetória,
conquistas, melhores momentos), página de cada núcleo, explorar, mensagens e
publicação pensada pra treino. Tema claro por padrão, com botão pra escuro.
Toda a lógica está em rede.js; este arquivo é a casca (HTML + CSS). -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F9F8">
<title>Rede Liberdade</title><link rel="icon" type="image/png" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="rede.css?v=20260925a">
</head>
<body>
<noscript>A Rede Liberdade precisa de JavaScript habilitado.</noscript>

<div id="telaCarregando" class="tela-centro"><div class="spinner"></div><p>Abrindo a Rede Liberdade…</p></div>

<div id="telaSemSessao" class="tela-centro oculto">
<div class="card" style="max-width:380px; text-align:center;">
<img src="logo-liberdade150.png" alt="Capoeira Liberdade" style="width:72px; margin:0 auto 10px; display:block;">
<span class="eyebrow">Capoeira Liberdade</span>
<h1 style="font-size:1.2rem; margin-bottom:6px;">Rede Liberdade</h1>
<p style="color:var(--muted); font-size:.9rem; line-height:1.5;">A rede é fechada: só entra quem tem cadastro no grupo. Faça login no app e volte por aqui.</p>
<a class="btn-verde" href="login.html" style="display:inline-flex; margin-top:14px; text-decoration:none;">Entrar no app</a>
</div>
</div>

<div id="app" class="oculto">
<header class="topo">
<a href="app.html" class="btn-icone" title="Voltar ao app" aria-label="Voltar ao app"><i class="fas fa-arrow-left"></i></a>
<div class="marca" id="marcaTopo"><span class="eyebrow">Capoeira Liberdade</span><h1 id="tituloTopo">Rede Liberdade</h1></div>
<div class="acoes">
<button type="button" class="btn-icone" id="btnTema" title="Tema claro/escuro" aria-label="Alternar tema"><i class="fas fa-moon"></i></button>
<button type="button" class="btn-icone" id="btnModeracao" title="Moderação" aria-label="Moderação" style="display:none;"><i class="fas fa-shield-halved"></i><span class="ponto oculto" id="pontoModeracao"></span></button>
<button type="button" class="btn-icone" id="btnMensagensTopo" title="Mensagens" aria-label="Mensagens"><i class="far fa-comment"></i><span class="ponto oculto" id="pontoMsg"></span></button>
</div>
</header>

<main id="vista" class="vista"></main>

<nav class="nav-inferior" aria-label="Navegação da rede">
<button type="button" data-rota="feed" class="ativo" aria-label="Início"><i class="fas fa-house"></i><span>Início</span></button>
<button type="button" data-rota="explorar" aria-label="Explorar"><i class="fas fa-magnifying-glass"></i><span>Explorar</span></button>
<button type="button" data-rota="publicar" class="mais" aria-label="Publicar"><i class="fas fa-plus"></i></button>
<button type="button" data-rota="mensagens" aria-label="Mensagens"><i class="far fa-comment"></i><span>Mensagens</span></button>
<button type="button" data-rota="perfil" aria-label="Meu perfil"><i class="far fa-user"></i><span>Perfil</span></button>
</nav>
</div>

<!-- Visualizador de stories -->
<div id="storyViewer" class="story-viewer oculto" role="dialog" aria-label="Story">
<div class="story-progresso" id="storyProgresso"></div>
<div class="story-topo"><div id="storyAutor"></div><button type="button" class="btn-icone escuro" id="btnFecharStory" aria-label="Fechar"><i class="fas fa-xmark"></i></button></div>
<div class="story-midia" id="storyMidia"></div>
<div class="story-texto" id="storyTexto"></div>
<button type="button" class="story-nav esq" id="storyAnt" aria-label="Anterior"></button>
<button type="button" class="story-nav dir" id="storyProx" aria-label="Próximo"></button>
<div class="story-rodape" id="storyRodape"></div>
</div>

<!-- Visualizador de mídia (foto/vídeo em tela cheia) -->
<div id="midiaViewer" class="midia-viewer oculto" role="dialog" aria-label="Mídia">
<button type="button" class="btn-icone escuro" id="btnFecharMidia" aria-label="Fechar"><i class="fas fa-xmark"></i></button>
<div id="midiaConteudo"></div>
</div>

<input type="file" id="inputMidia" accept="image/*,video/*" multiple class="oculto">
<input type="file" id="inputStory" accept="image/*" class="oculto">
<input type="file" id="inputFotoPerfil" accept="image/*" class="oculto">
<input type="file" id="inputCapa" accept="image/*" class="oculto">

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="rede.js?v=20260925a"></script>
</body>
</html>
