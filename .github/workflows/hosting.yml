# Publica os DOIS sites no Firebase Hosting (projeto atletapay-br), sozinho, a cada envio na main:
#   • atletapay-br        → atletapay.com.br: o site da AtletaPay (pasta atletapay/) na raiz e o app
#                            de todas as escolas em /app (montado por tools/montar-dist.mjs);
#                            atletapay.com.br/<escola>/login etc. reescrevem para /app (firebase.json)
#   • liberdadeeexpressao → o app como sempre foi (raiz do repositório), para o domínio próprio da Liberdade
# Usa o mesmo segredo ATLETAPAY_SERVICE_ACCOUNT do firebase.yml — nada novo.
# O GitHub Pages continua publicando o app como sempre; este é um endereço a mais.
name: Hosting (app e AtletaPay)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'functions/**'
      - 'tests/**'
      - 'firebase/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

env:
  PROJETO: atletapay-br

jobs:
  publicar:
    name: Publicar no Firebase Hosting
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Entrar no Google Cloud com a conta de serviço
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.ATLETAPAY_SERVICE_ACCOUNT }}
      - name: Instalar o Firebase CLI
        run: npm install -g firebase-tools --no-audit --no-fund
      - name: Montar a pasta dist (site da AtletaPay + app em /app)
        run: node tools/montar-dist.mjs
      - name: Garantir que o site da Liberdade existe (só faz algo na primeira vez)
        run: firebase hosting:sites:create liberdadeeexpressao --project "$PROJETO" --non-interactive 2>/dev/null || echo "Site liberdadeeexpressao já existe."
      - name: Publicar os dois sites
        run: firebase deploy --only hosting --project "$PROJETO" --non-interactive -m "GitHub ${{ github.sha }}"
