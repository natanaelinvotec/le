# Depois da virada para o projeto atletapay-br: fecha o projeto ANTIGO (capoeira-liberdade).
#   • regras do Firestore e do Storage: ninguém lê nem grava (versões velhas do app não estragam nada)
#   • capoeira-liberdade.web.app e atletapay.web.app passam a levar para atletapay.com.br/<escola>/…
#     (e o service worker novo apaga o app guardado no aparelho)
# Roda só pelo botão Actions → Run workflow. Usa o segredo do projeto antigo (FIREBASE_SERVICE_ACCOUNT).
# As Cloud Functions antigas você apaga pelo Console (Functions → selecionar todas → Excluir) ou
# deixa: sem leitura/escrita no banco elas não fazem mais nada e custam zero paradas.
name: Desligar o projeto antigo (capoeira-liberdade)

on:
  workflow_dispatch:
    inputs:
      confirmo:
        description: 'Digite DESLIGAR para confirmar (fecha o banco e o Storage do projeto antigo)'
        type: string
        required: true

jobs:
  desligar:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmação
        if: github.event.inputs.confirmo != 'DESLIGAR'
        run: echo "::error::Digite DESLIGAR no campo de confirmação." && exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm install -g firebase-tools --no-audit --no-fund
      - name: Fechar o banco, o Storage e publicar o redirecionamento
        working-directory: tools/antigo
        run: firebase deploy --only firestore:rules,storage,hosting --project capoeira-liberdade --non-interactive -m "Projeto migrado para atletapay-br"
