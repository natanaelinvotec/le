<script type="module">
/* Prévia do template "horizons" SEM Firestore: monta um objeto `s` igual ao que
   site-escola.js produz em mapEscola() e chama o módulo diretamente.
   Fotos: stock (Pexels, uso livre) só para visualização — em produção vêm do cadastro da escola. */
import { TEMPLATES, carregarTemplate } from './js/site-templates.js';

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const url = (u) => { const s = String(u == null ? '' : u).trim(); if(!s) return ''; if(/^https:\/\/[^\s"'<>\\]+$/i.test(s)) return s; if(/^[a-z0-9][a-z0-9._\/-]*$/i.test(s) && !s.includes('..')) return s; if(/^data:image\/svg\+xml[,;]/i.test(s)) return s; return ''; };

  jiujitsu:{ saudacao:"Oss!", local:"tatame", luta:"rola", nomeMod:"Jiu-jitsu" },

const mod = qs.get('mod') || (tpl === 'luva' ? 'boxe' : tpl === 'escudo' ? 'kravmaga' : tpl === 'mongkon' ? 'muaythai' : 'karate');

  boxe:     { fachada:[P(8745178,2000)], treino:[P(5750886,1400),P(6456308,1400),P(31403621,1400),P(5424583,900,1200),P(7991688,900,1200),P(6740342,900,1200),P(6699106,900,1200),P(4753898,2000)], equipe:[] },
  kravmaga: { fachada:[P(7045491,1600)], treino:[P(7045584,1400),P(6455245,1400),P(32321639,1600),P(7045661,900,900),P(10823763,900,900),P(7045738,900,900),P(6296025,900,900),P(6295767,900,900),P(6296032,900,900)], equipe:[] },
  mma:      { fachada:[P(17892072,2000)], treino:[P(6295992,900,1125),P(17892069,900,1125),P(8612527,900,1125)], equipe:[] }

const CORES = {
  karate:{ principal:'#e4432e', destaque:'#131313', botao:'#e4432e' },
  capoeira:{ principal:'#1f7a4d', destaque:'#f2b705', botao:'#f2b705' },
  jiujitsu:{ principal:'#1b3a8a', destaque:'#389E92', botao:'#00E676' },
  muaythai:{ principal:'#8a1c1c', destaque:'#c8912e', botao:'#c8912e' },
  boxe:{ principal:'#131313', destaque:'#d4a017', botao:'#d4a017' },
  mma:{ principal:'#101418', destaque:'#00E676', botao:'#00E676' },
  kravmaga:{ principal:'#0c1a2b', destaque:'#ffc400', botao:'#ffc400' }

const PECA = { capoeira:"cordão", jiujitsu:"faixa", judo:"faixa", karate:"faixa", taekwondo:"faixa", muaythai:"prajied", boxe:"nível", mma:"nível", kravmaga:"nível" };

// Escada fictícia da Equipe Horizons por modalidade (em produção vem de escolasPublicas.escada).
const E = (...p) => p.map(([nome, cor]) => ({ nome, cor }));
const ESCADA = {
  karate:   E(['Branca','#f4f4f4'],['Amarela','#f2c524'],['Laranja','#ef7d1a'],['Verde','#2f9e44'],['Azul','#1c64c2'],['Roxa','#6f42c1'],['Marrom','#6b3e1e'],['Preta','#141414']),
  capoeira: E(['Crua','#e6d8b8'],['Amarelo','#f2c524'],['Laranja','#ef7d1a'],['Azul','#1c64c2'],['Verde','#2f9e44'],['Roxo','#6f42c1'],['Marrom','#6b3e1e'],['Vermelho','#c62828']),
  jiujitsu: E(['Branca','#f4f4f4'],['Azul','#1c64c2'],['Roxa','#6f42c1'],['Marrom','#6b3e1e'],['Preta','#141414']),
  muaythai: E(['Branca','#f4f4f4'],['Amarela','#f2c524'],['Laranja','#ef7d1a'],['Verde','#2f9e44'],['Azul','#1c64c2'],['Marrom','#6b3e1e'],['Vermelha','#c62828'],['Preta','#141414']),
  boxe:     E(['Iniciante','#cfd8dc'],['Intermediário','#90a4ae'],['Avançado','#546e7a'],['Competição','#d4a017']),
  kravmaga: E(['P1','#f4f4f4'],['P2','#f2c524'],['P3','#ef7d1a'],['P4','#2f9e44'],['P5','#1c64c2'],['G1','#6b3e1e']),
  mma:      E(['Iniciante','#cfd8dc'],['Intermediário','#90a4ae'],['Avançado','#546e7a'],['Competição','#00E676'])
};

// Fotos da equipe por modalidade (boxe tem o próprio trio; demais usam as de karatê).
const EQF = mod === 'boxe' ? [P(38510608,900,1125), P(6740346,900,1125), P(8612588,900,1125)] : mod === 'kravmaga' ? [P(7045757,900,1125), P(6455243,900,1125), P(7045658,900,1125)] : [P(15937400,900,1200), P(6005463,900,1200), P(10655538,900,1200)];
const s = {
  id:'horizons', slug:'horizons', nome:'Equipe Horizons', nomeCurto:'Horizons',
  modalidade: mod, cidade:'Campo Grande', uf:'MS',
  endereco:'Rua dos Horizontes, 1200 · Jardim dos Estados', instagram:'equipehorizons', dominio:'',
  cores: CORES[mod] || CORES.karate,
  lider:'Ricardo Nakamura', peca: PECA[mod] || 'graduação', logo: logoSVG,
  escada: ESCADA[mod] || ESCADA.karate, template:'horizons',
  // nucleos (só nomes, formato do arena) + nucleosInfo (campos públicos de nucleosPublicos)
  nucleos:['Horizons Centro', 'Horizons Norte', 'Horizons Lagoa'],
  nucleosInfo:[
    { nome:'Horizons Centro', sede:true,  cidade:'Campo Grande', uf:'MS' },
    { nome:'Horizons Norte',  sede:false, cidade:'Campo Grande', uf:'MS' },
    { nome:'Horizons Lagoa',  sede:false, cidade:'Campo Grande', uf:'MS' }
  ],
  fotoLider: EQF[0],
  fotos: FOTOS[mod] || FOTOS.karate,
  graduacoes: (ESCADA[mod] || ESCADA.karate).map(b => b.nome),
  responsavel: { nome:'Ricardo Nakamura', graduacao: (LIDER[mod]||'Professor') + ' · 5º Dan' },
  // equipe[] opcional: quando o cadastro tiver mais pessoas, aparecem aqui (fotoRecorte = PNG com fundo transparente p/ efeito 3D)
  // fotoRecorte = PNG/WebP com fundo transparente (oval cru embutido) → efeito 3D "saindo" do bloco.
  // Na prévia vêm de assets/horizons/ (caminho local relativo, aceito por url()); em produção, da escola.
  equipe: [
    { nome:'Ricardo Nakamura', graduacao: mod === 'kravmaga' ? 'Graduado · G2' : (LIDER[mod]||'Professor')+' · 5º Dan', bio:'Fundador da Equipe Horizons. Forma atletas há mais de duas décadas com uma regra só: técnica antes de força.', foto:EQF[0], fotoRecorte:'assets/horizons/ricardo.webp' },
    { nome:'Ana Beatriz Horta', graduacao:(LIDER[mod]||'Professora')+' · 3º Dan', bio:'Coordena as turmas femininas e o programa competitivo. Aulas conhecidas pela atenção ao detalhe.', foto:EQF[1], fotoRecorte:'assets/horizons/ana.webp' },
    { nome:'Caio Ferreira', graduacao:(LIDER[mod]||'Professor')+' · 2º Dan', bio:'Técnico da equipe de competição: estratégia, condicionamento e cabeça fria.', foto:EQF[2], fotoRecorte:'assets/horizons/caio.webp' }
  ],
  // Coordenadas fictícias (Jardim dos Estados, Campo Grande) → mapa real na seção de contato.
  geo: { lat: -20.4569, lng: -54.5995 }
};

// Conteúdo fictício do painel (siteConteudo) só para o Luva mostrar horários e citação preenchidos.
const HOR = [
    { dia:'seg', aula:'Fundamentos', horario:'19:00–20:30', local:'Núcleo Centro' }, { dia:'seg', aula:'Feminino', horario:'20:30–21:30', local:'Núcleo Norte' },
    { dia:'ter', aula:'Condicionamento', horario:'06:30–07:30', local:'Núcleo Centro' }, { dia:'ter', aula:'Jovens', horario:'17:30–18:30', local:'Núcleo Lagoa' },
    { dia:'qua', aula:'Fundamentos', horario:'19:00–20:30', local:'Núcleo Centro' }, { dia:'qua', aula:'Avançado · cenários', horario:'20:30–22:00', local:'Núcleo Centro' },
    { dia:'qui', aula:'Condicionamento', horario:'06:30–07:30', local:'Núcleo Norte' }, { dia:'sex', aula:'Fundamentos', horario:'19:00–20:30', local:'Núcleo Lagoa' },
    { dia:'sab', aula:'Treinão aberto', horario:'08:00–09:30', local:'Parque das Nações' } ];
s.conteudo = tpl === 'escudo' ? { secoes: {
  contato: { whatsapp: '67999990000' },
  graduacao: { itens: [{ etapa:'Iniciante', sigla:'P1' }, { etapa:'Básico', sigla:'P2' }, { etapa:'Intermediário', sigla:'P3' }, { etapa:'Intermediário', sigla:'P4' }, { etapa:'Avançado', sigla:'P5' }, { etapa:'Avançado', sigla:'G1' }] },
  agenda: { itens: [{ dia:'08', mes:'11', titulo:'Exame de graduação', local:'Núcleo Centro · P1 a P3', hora:'09:00' }, { dia:'22', mes:'11', titulo:'Workshop defesa feminina', local:'Aberto ao público · Núcleo Norte', hora:'14:00' }, { dia:'06', mes:'12', titulo:'Seminário com instrutor convidado', local:'Núcleo Centro', hora:'10:00' }, { dia:'13', mes:'12', titulo:'Treinão de encerramento', local:'Todos os núcleos · Parque das Nações', hora:'08:00' }] },
  horarios: { itens: HOR },
  parceiros: { itens: [{ nome:'Nutri+' }, { nome:'Fisio Vida' }, { nome:'Tático Store' }, { nome:'Clube MS' }] }
} } : tpl === 'mongkon' ? { secoes: {
  // Imagens criadas pelo fundador (IA) para a demo do Mongkon: hero de sparring e pôster do atleta (PNG transparente).
  hero: mod === 'muaythai' ? { foto: 'assets/mongkon/sparring.webp' } : {},
  atleta: { nome: 'Thiago Silva', foto: 'assets/mongkon/nofear.webp', titulo: 'Treine *duro*, lute fácil.', texto: 'Thiago Silva começou no Núcleo Centro e hoje representa a Equipe Horizons nos eventos profissionais. O mesmo ' + (VOCAB[mod]?.local || 'tatame') + ', a mesma equipe, o mesmo app que acompanha a sua evolução.', vitorias: '24', derrotas: '0', empates: '0' },
  contato: { whatsapp: '67999990000' },
  horarios: { itens: [
    { dia:'seg', aula:'Fundamentos', horario:'07:00–08:00', local:'Centro' }, { dia:'seg', aula:'Sparring', horario:'19:30–21:00', local:'Centro' },
    { dia:'ter', aula:'Thai pads', horario:'06:30–07:30', local:'Norte' }, { dia:'ter', aula:'Feminino', horario:'19:00–20:00', local:'Centro' },
    { dia:'qua', aula:'Fundamentos', horario:'07:00–08:00', local:'Centro' }, { dia:'qua', aula:'Infantil', horario:'17:30–18:30', local:'Lagoa' },
    { dia:'qui', aula:'Clinch', horario:'12:00–13:00', local:'Centro' }, { dia:'qui', aula:'Sparring', horario:'19:30–21:00', local:'Centro' },
    { dia:'sex', aula:'Thai pads', horario:'06:30–07:30', local:'Norte' }, { dia:'sex', aula:'Equipe de competição', horario:'19:00–21:00', local:'Centro' },
    { dia:'sab', aula:'Aula aberta', horario:'09:00–10:30', local:'Lagoa' } ] }
} } : tpl === 'luva' ? { secoes: {
  citacao: { autor: 'Ricardo Nakamura', cargo: 'Treinador-chefe · Equipe Horizons' },
  contato: { whatsapp: '67999990000' },
  horarios: { itens: [
    { dia:'seg', aula:'Fundamentos', horario:'07:00–08:00', local:'Centro' }, { dia:'seg', aula:'Sparring', horario:'19:30–21:00', local:'Centro' },
    { dia:'ter', aula:'Treino físico', horario:'06:30–07:30', local:'Norte' }, { dia:'ter', aula:'Feminino', horario:'19:00–20:00', local:'Centro' },
    { dia:'qua', aula:'Fundamentos', horario:'07:00–08:00', local:'Centro' }, { dia:'qua', aula:'Infantil', horario:'17:30–18:30', local:'Lagoa' },
    { dia:'qui', aula:'Manopla', horario:'12:00–13:00', local:'Centro' }, { dia:'qui', aula:'Sparring', horario:'19:30–21:00', local:'Centro' },
    { dia:'sex', aula:'Treino físico', horario:'06:30–07:30', local:'Norte' }, { dia:'sex', aula:'Equipe de competição', horario:'19:00–21:00', local:'Centro' },
    { dia:'sab', aula:'Aula aberta', horario:'09:00–10:30', local:'Lagoa' } ] }
} } : null;
// ---- Personalização (vitrine / simulação de inscrição) ----------------------------------
// Parâmetros: ?nome=…&principal=#rrggbb&destaque=#rrggbb&embed=1 (embed esconde a barrinha).
// Ao vivo: a vitrine (mesmo domínio, janela-mãe) manda postMessage {tipo:'ap-vitrine', nome, principal, destaque}
// e o site é redesenhado sem recarregar. Tudo é revalidado aqui; nada é gravado.
const BASE = JSON.stringify(s);
const hexOk = (v) => /^#[0-9a-f]{6}$/i.test(String(v || '')) ? String(v).toLowerCase() : '';
const limparNome = (v) => String(v || '').normalize('NFC').replace(/[^\p{L}\p{N} .'&-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 40);
const GENERICO = /^(equipe|academia|escola|grupo|associa[cç][aã]o|centro|clube|team|instituto|projeto|cia\.?|companhia|ct|de|da|do|dos|das|e)$/i;
const LIGA = /^(de|da|do|dos|das|e|&)$/i;
// "Academia Leão de Ouro" → "Leão de Ouro"; "Equipe Horizons" → "Horizons"; "Team Alpha Fight" → "Alpha Fight".
const curto = (n) => { const w = n.split(' '); while (w.length > 1 && GENERICO.test(w[0])) w.shift(); const k = (w.length >= 3 && LIGA.test(w[1])) ? 3 : 2; return w.slice(0, k).join(' '); };
const slugify = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const jsonTxt = (v) => JSON.stringify(v).slice(1, -1);
function personalizar(p) {
  const nome = limparNome(p.nome);
  const trocar = nome && nome !== 'Equipe Horizons';
  let txt = BASE;
  if (trocar) txt = txt.split('Equipe Horizons').join(jsonTxt(nome)).split('Horizons').join(jsonTxt(curto(nome)));
  const o = JSON.parse(txt);
  if (trocar) { o.slug = o.id = slugify(nome) || 'horizons'; o.instagram = o.slug.replace(/-/g, ''); o.logo = null; }
  const pr = hexOk(p.principal), de = hexOk(p.destaque);
  o.cores = { ...o.cores };
  if (pr) o.cores.principal = pr;
  if (de) { o.cores.destaque = de; o.cores.botao = de; }
  return o;
}

const m = await carregarTemplate(tpl);
const desenharTpl = m && (m.render || m.renderHorizons);
const H = { esc, url, VOCAB, LIDER, modalidadeBase: VOCAB[mod] ? mod : 'arena', modalidade: mod };
let atual = { nome: qs.get('nome') || '', principal: qs.get('principal') || '', destaque: qs.get('destaque') || '' };
function desenhar() {
  const y = scrollY;
  desenharTpl(personalizar(atual), H);
  if (y) scrollTo(0, y);
  document.title = `Prévia ${TEMPLATES[tpl].nome} · ${VOCAB[mod]?.nomeMod || mod}`;
}
desenhar();
if (qs.get('embed') === '1') {
  document.getElementById('pv').hidden = true;
  // Dentro da moldura de tablet/celular da vitrine: rola sem mostrar a barra de rolagem.
  const est = document.createElement('style');
  est.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}';
  document.head.appendChild(est);
}
addEventListener('message', (e) => {
  if (e.origin !== location.origin || e.source !== parent) return;
  const d = e.data;
  if (!d || typeof d !== 'object' || d.tipo !== 'ap-vitrine') return;
  atual = { nome: String(d.nome || '').slice(0, 80), principal: String(d.principal || ''), destaque: String(d.destaque || '') };
  try { desenhar(); } catch (err) { console.warn('prévia: falha ao redesenhar', err); }
});
if (parent !== window) parent.postMessage({ tipo: 'ap-vitrine-pronta', tpl, mod }, location.origin);

// barrinha de navegação da prévia (uso direto, fora da vitrine)
// Caminho absoluto: com <base href="/app/"> um href "?…" relativo cairia em /app/ (Em breve).
const AQUI = esc(location.pathname);
const outros = Object.keys(TEMPLATES).filter((k) => TEMPLATES[k].modulo);
document.getElementById('pvT').innerHTML = outros.map((k) => `<a href="${AQUI}?tpl=${k}&mod=${mod}"${k === tpl ? ' style="color:#fff;text-decoration:underline"' : ''}>${TEMPLATES[k].nome}</a>`).join('');
document.getElementById('pvM').innerHTML = ['karate','capoeira','jiujitsu','muaythai','boxe','mma','kravmaga'].map((k) => `<a href="${AQUI}?tpl=${tpl}&mod=${k}"${k === mod ? ' style="color:#fff;text-decoration:underline"' : ''}>${VOCAB[k].nomeMod}</a>`).join('');
</script>
</body>
</html>
