// ---- Personalização (vitrine / simulação de inscrição) ----------------------------------
// Parâmetros: ?nome=…&principal=#rrggbb&destaque=#rrggbb&embed=1 (embed esconde a barrinha).
// Ao vivo: a vitrine (mesmo domínio, janela-mãe) manda postMessage {tipo:'ap-vitrine', nome, principal, destaque}
// e o site é redesenhado sem recarregar. Tudo é revalidado aqui; nada é gravado.
const BASE = JSON.stringify(s);
const hexOk = (v) => /^#[0-9a-f]{6}$/i.test(String(v || '')) ? String(v).toLowerCase() : '';
const limparNome = (v) => String(v || '').normalize('NFC').replace(/[^\p{L}\p{N} .'&-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 40);
const GENERICO = /^(equipe|academia|escola|grupo|associa[cç][aã]o|centro|clube|team|instituto|projeto|cia\.?|companhia|ct|de|da|do|dos|das|e)$/i;
const LIGA = /^(de|da|do|dos|das|e|&)$/i;
// "Academia Leão de Ouro" → "Leão de Ouro"; "Equipe Horizons" → "Horizons"; "Team Alpha Fight" → "Alpha Fight".
const curto = (n) => { const w = n.split(' '); while (w.length > 1 && GENERICO.test(w[0])) w.shift(); const k = (w.length >= 3 && LIGA.test(w[1])) ? 3 : 2; return w.slice(0, k).join(' '); };
const slugify = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const jsonTxt = (v) => JSON.stringify(v).slice(1, -1);
function personalizar(p) {
  const nome = limparNome(p.nome);
  const trocar = nome && nome !== 'Equipe Horizons';
  let txt = BASE;
  if (trocar) txt = txt.split('Equipe Horizons').join(jsonTxt(nome)).split('Horizons').join(jsonTxt(curto(nome)));
  const o = JSON.parse(txt);
  if (trocar) { o.slug = o.id = slugify(nome) || 'horizons'; o.instagram = o.slug.replace(/-/g, ''); o.logo = null; }
  const pr = hexOk(p.principal), de = hexOk(p.destaque);
  o.cores = { ...o.cores };
  if (pr) o.cores.principal = pr;
  if (de) { o.cores.destaque = de; o.cores.botao = de; }
  return o;
}
